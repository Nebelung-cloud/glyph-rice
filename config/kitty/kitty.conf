# demonshot: Crypt background, the cursor — a bone block, 16 colors from the spec (blue/green only here)

font_family      JetBrainsMono Nerd Font
font_size 11.0

cursor_shape block
cursor_blink_interval 0
cursor_trail 4

background_opacity 1
window_padding_width 18 20
confirm_os_window_close 0
shell fish

color0  #1A1519
color1  #C7303D
color2  #7F9A84
color3  #C49A6C
color4  #6F7FB0
color5  #B8487A
color6  #6E9AA0
color7  #CFC4C3
color8  #4A3D45
color9  #E0525C
color10 #9DB8A2
color11 #DDB78B
color12 #8E9CC9
color13 #D46C9A
color14 #8FBAC0
color15 #E9DFDD

# on top of everything above — the live shell's file: demonshot writes interface colors from the house rules palette (Rules.qml),
# glyph — its own colors, 16 ANSI, font and padding (Theme.apply). Switched shell — the file is rewritten, kitty reloaded
include ~/.config/demonshot/kitty.conf

# after the include on purpose: glyph's Theme.apply writes cursor_trail 0 there
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
