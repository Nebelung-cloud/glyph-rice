# #######################################################################################
# GLYPH NOTHING OS HYPRLAND CONFIG
# #######################################################################################

# Monitor
monitor = , preferred, auto, 1

# Environment Variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Autostart
exec-once = ~/.config/quickshell/rice/rice start || quickshell -p ~/.config/quickshell/glyph -d
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle

# Applications
$terminal = kitty
$fileManager = nautilus
$browser = brave-browser

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
    sensitivity = 0
}

# General (Nothing OS Styling)
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(d71921ff) rgba(ffffff33) 45deg
    col.inactive_border = rgba(1a1a1aff)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# Decoration
decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000088)
    }
}

# Animations
animations {
    enabled = true
    bezier = nothingCurve, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, nothingCurve
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, nothingCurve
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = rgb(0e0e0e)
}

# #######################################################################################
# KEYBINDINGS
# #######################################################################################
$mainMod = SUPER

# Application Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser

# Close Active Window (Alt+F4, Super+C, Super+W)
bind = ALT, F4, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, W, killactive,

# Window State
bind = $mainMod, T, togglefloating,
bind = $mainMod, G, togglegroup,
bind = $mainMod, U, moveoutofgroup,
bind = $mainMod, comma, changegroupactive, b
bind = $mainMod, F, fullscreen, 0
bind = , F11, fullscreen, 0
bind = ALT, Return, fullscreen, 0
# Minimize / Restore Window
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized

# Switch / Cycle Windows (Alt+Tab Instant Ubuntu-Style Switcher)
bind = ALT, Tab, global, shell:alttab
bind = ALT SHIFT, Tab, global, shell:alttabPrev
bindr = , Alt_L, global, shell:alttabRelease
bindr = ALT, Alt_L, global, shell:alttabRelease
bindr = ALT SHIFT, Alt_L, global, shell:alttabRelease
bindr = , Alt_R, global, shell:alttabRelease
bindr = ALT, Alt_R, global, shell:alttabRelease
bindr = ALT SHIFT, Alt_R, global, shell:alttabRelease
bind = $mainMod, Tab, global, shell:alttab
bind = $mainMod SHIFT, Tab, global, shell:alttabPrev
bindr = $mainMod, Super_L, global, shell:alttabRelease
bindr = $mainMod, Super_R, global, shell:alttabRelease

# Nothing OS Shell Triggers (Quickshell Global Actions)
bind = $mainMod, Backslash, global, shell:winctl
bind = $mainMod, Grave, global, shell:winctl
bind = $mainMod, Space, global, shell:altar
bindr = , SUPER_L, global, shell:launcher
bind = $mainMod, D, global, shell:launcher
bind = $mainMod, A, global, shell:quick
bind = $mainMod, I, global, shell:settings
bind = $mainMod, Escape, global, shell:power
bind = $mainMod, V, global, shell:clip
bind = $mainMod, Period, global, shell:charms
bind = $mainMod SHIFT, W, global, shell:wall
bind = $mainMod, L, exec, ~/.config/quickshell/rice/rice lock

# Screenshots (Nothing OS Interactive Loupe Tool)
bind = , Print, global, shell:shot
bind = $mainMod SHIFT, S, global, shell:shot
bind = SHIFT, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"

# Window Resizing (Keyboard)
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30
binde = $mainMod, minus, resizeactive, -30 0
binde = $mainMod, equal, resizeactive, 30 0

# Focus Navigation (Arrows & Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/Resize Windows with Mouse (Super or Alt, like Ubuntu)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Ubuntu-style Floating Desktop: Apps open as free floating windows, draggable anywhere
windowrule = match:class .*, float 1
windowrule = match:class .*, center 1
windowrule = match:class .*, suppress_event maximize
windowrule = match:class .*, suppress_event fullscreen

# Audio & Media Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ || pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- || pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle || pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness Controls
bindel = , XF86MonBrightnessUp, global, shell:briUp
bindel = , XF86MonBrightnessDown, global, shell:briDown
