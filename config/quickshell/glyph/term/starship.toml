# glyph: ~/dir › — the directory in grey, the arrow white, an error red. Colors — as ANSI numbers, kitty's light theme rearranges them.
# ~/.config/starship.toml links here while glyph is alive (rice)
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "white"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ●"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bright-white"
format = "[$branch]($style) "

[git_status]
style = "bright-black"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[$duration]($style) "

[character]
success_symbol = "[›](bright-white)"
error_symbol = "[›](red)"
vimcmd_symbol = "[‹](bright-white)"
